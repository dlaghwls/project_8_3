name: stroke_care_mobile
description: StrokeCare+ 환자·보호자용 앱
version: 0.1.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  intl: ^0.19.0

  dio: ^5.1.2
  flutter_secure_storage: ^8.0.0
  provider: ^6.0.5

  firebase_core: ^2.10.0
  firebase_messaging: ^14.6.1

  get_it: ^7.2.0
  # flutter_localizations는 반드시 이 레벨(공백 2칸)로!
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - lib/mock/sample_selfchecks.json